name: Install reviewed 30-design gallery
on:
  push:
    branches: [main]
    paths:
      - 'gallery-30-media-upload.zip'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mads-gallery30-install
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify single approved payload upload
        shell: bash
        run: |
          set -euo pipefail
          test -f gallery-30-media-upload.zip || { echo 'Missing upload ZIP. Add gallery-30-media-upload.zip to the repository root first.'; exit 1; }
          python - <<'PY'
          import zipfile
          p='gallery-30-media-upload.zip'
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              assert len(names)==61, 'Expected 30 full-size photos, 30 thumbnails and one manifest'
              assert len(set(names))==len(names), 'Duplicate archive paths'
              assert 'gallery30-manifest.json' in names
              assert all(n=='gallery30-manifest.json' or (n.startswith('assets/gallery-30/') and n.endswith('.webp') and '..' not in n) for n in names), 'Unexpected archive member'
              assert all(not n.startswith('/') for n in names)
              assert z.testzip() is None
          print('Original-media ZIP: 60 image files + selection manifest verified')
          PY
      - name: Install photographs and validate image hashes
        shell: bash
        run: |
          set -euo pipefail
          unzip -q gallery-30-media-upload.zip
          python - <<'PY'
          import json, hashlib, pathlib
          root=pathlib.Path('.')
          records=json.loads((root/'gallery30-manifest.json').read_text())['records']
          assert len(records)==30
          for r in records:
              for field, digest in [('coverImage','sha256Detail'),('thumbnailImage','sha256Thumb')]:
                  source=(root/r[field]).read_bytes()
                  assert hashlib.sha256(source).hexdigest()==r[digest], 'Hash mismatch: '+r[field]
          print('All 60 optimised original photographs match the source hashes.')
          PY
      - name: Apply catalogue, cache-busting, original post links and private approval controls
        run: python3 scripts/apply-gallery-30.py
      - name: Validate site catalogue and navigation with regression test
        run: node scripts/test-editorial-presentation.mjs
      - name: Commit tested gallery as one reviewed change
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          mv gallery30-manifest.json data/gallery-30-manifest.json
          rm gallery-30-media-upload.zip
          git add cakes.json index.html assets/gallery-30 assets/site.js assets/site.css scripts/test-editorial-presentation.mjs
          git add about/index.html cakes/index.html decorate-and-sip/index.html enquire/index.html 404.html data/gallery-30-manifest.json
          git add -u gallery-30-media-upload.zip
          git diff --cached --quiet && { echo 'Gallery files unchanged'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Activate 30 original cake designs in owner-only preview'
          git pull --rebase origin main
          git push origin HEAD:main
          echo "Installed 30 verified photo-backed designs. Owner approval and noindex safeguards retained."
