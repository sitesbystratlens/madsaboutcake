name: Verify Mads brand-guide website
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'weddings/**'
      - 'celebrations/**'
      - 'tiramisu-cakes/**'
      - 'decorate-and-sip/**'
      - 'cake-care/**'
      - 'enquire/**'
      - 'about/**'
      - 'cakes/**'
      - '404.html'
      - 'assets/brand-site.css'
      - 'assets/brand-site.js'
      - 'assets/brand/**'
      - 'cakes.json'
      - 'assets/public-creations.json'
      - '.assetsignore'
      - 'wrangler.jsonc'
      - 'scripts/test-editorial-presentation.mjs'
      - '.github/workflows/check-editorial-presentation.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify brand guideline, category galleries, care text and contact guardrails
        run: |
          node --check assets/brand-site.js
          node scripts/test-editorial-presentation.mjs
