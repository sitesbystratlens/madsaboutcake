name: Verify deployed Mads branded homepage
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/brand-site.css'
      - 'assets/brand-site.js'
      - 'assets/brand/**'
      - '.github/workflows/check-live-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Validate brand header, source logo and four category cards
        shell: bash
        run: |
          set -euo pipefail
          SITE=https://madsaboutcake.sitesbystratlens.workers.dev
          for n in $(seq 1 15); do
            curl -fsSL --max-time 25 "$SITE/?r=$GITHUB_SHA-$n" >/tmp/mads-home.html || true
            curl -fsSL --max-time 25 "$SITE/assets/brand-site.css?r=$GITHUB_SHA-$n" >/tmp/mads-brand.css || true
            if grep -Fq 'A little cake, a lot of love.' /tmp/mads-home.html &&
               grep -Fq 'wordmark-set-2.svg' /tmp/mads-home.html &&
               grep -Fq 'data-cake-toggle' /tmp/mads-home.html &&
               grep -Fq 'href="/cakes/?filter=cupcakes"' /tmp/mads-home.html &&
               grep -Fq 'Handcrafted sweets for every occasion.' /tmp/mads-home.html &&
               grep -Fq 'href="sms:+61425819951"' /tmp/mads-home.html &&
               grep -Fq 'brand-site.css?v=20261102-nav1' /tmp/mads-home.html &&
               grep -Fq 'href="/weddings/"' /tmp/mads-home.html &&
               grep -Fq 'href="/celebrations/"' /tmp/mads-home.html &&
               grep -Fq 'href="/tiramisu-cakes/"' /tmp/mads-home.html &&
               grep -Fq 'href="/decorate-and-sip/"' /tmp/mads-home.html &&
               grep -Fq '#9A2849' /tmp/mads-brand.css &&
               grep -Fq '#F6F4F0' /tmp/mads-brand.css; then
              curl -fsSL --max-time 25 "$SITE/assets/brand/wordmark-set-2.svg" >/tmp/mads-logo.svg
              grep -Fq 'data:image/webp;base64,' /tmp/mads-logo.svg
              echo 'PASS: brand site homepage, genuine artwork, palette, categories'
              exit 0
            fi
            echo "Waiting for branded preview deployment ($n of 15)"
            sleep 10
          done
          exit 1
