name: Mads visual QA screenshots
on:
  push:
    branches: [main]
    paths:
      - 'scripts/visual-qa.mjs'
      - '.github/workflows/visual-qa.yml'
      - 'assets/home-v3.css'
      - 'index.html'
      - 'cakes/index.html'
      - 'decorate-and-sip/index.html'
      - 'assets/site.css'
      - 'assets/site.js'
      - 'cakes.json'
      - 'assets/gallery-30/**'
      - 'review/index.html'
      - 'assets/gallery-review.css'
      - 'assets/gallery-review.js'
      - 'assets/gallery-review-covers/**'
      - 'data/gallery-review-candidates.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser
        run: |
          npm install --no-save playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Start static preview server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/mads-preview.log 2>&1 &
          sleep 3
      - name: Validate runtime JavaScript syntax
        run: node --check assets/site.js
      - name: Capture desktop, tablet and mobile pages
        run: node scripts/visual-qa.mjs
      - name: Save screenshots and checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mads-visual-qa-screenshots
          path: qa-screenshots/
          retention-days: 7
          if-no-files-found: warn
