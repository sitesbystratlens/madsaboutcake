name: Verify Mads branded 120-creation galleries and imagery
on:
  push:
    branches: [main]
    paths:
      - 'cakes.json'
      - 'assets/brand-site.js'
      - 'assets/brand-site.css'
      - 'cakes/index.html'
      - 'weddings/**'
      - 'celebrations/**'
      - 'tiramisu-cakes/**'
      - '.github/workflows/verify-live-gallery30.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Check final gallery source and brand JS live
        shell: bash
        run: |
          set -euo pipefail
          SITE=https://madsaboutcake.sitesbystratlens.workers.dev
          for n in $(seq 1 15); do
            curl -fsSL --max-time 25 "$SITE/cakes.json?r=$GITHUB_SHA-$n" >/tmp/mbcakes.json || true
            curl -fsSL --max-time 25 "$SITE/assets/brand-site.js?r=$GITHUB_SHA-$n" >/tmp/mbrand.js || true
            if grep -Fq 'const isTiramisu' /tmp/mbrand.js &&
               python3 - <<'PY'
          import json
          db=json.load(open('/tmp/mbcakes.json'))
          c=[x for x in db['cakes'] if x.get('featured30')]
          wed=[x for x in c if x.get('primaryOccasion')=='Weddings & engagements' or 'Weddings & engagements' in x.get('otherOccasions',[])]
          tir=[x for x in c if 'tiramisu' in (str(x.get('title',''))+' '+str(x.get('shortDescription',''))+' '+str(x.get('captionEvidence',''))).lower()]
          assert len(c)==120 and len(wed)==9 and len(tir)==1
          assert all(x['showOnWebsite']=='No' and x['approvalStatus']=='Draft' for x in db['cakes'])
          print('120 final creations, nine weddings, one verified tiramisu, draft-only gates')
          PY
            then
              break
            fi
            if [[ "$n" == 15 ]]; then echo 'Gallery not deployed'; exit 1; fi
            sleep 10
          done
      - name: Verify every featured original cover and thumbnail is accessible
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures,json,subprocess
          db=json.load(open('/tmp/mbcakes.json'))
          paths=sorted({p for c in db['cakes'] if c.get('featured30') for p in [c['coverImage'],c.get('thumbnailImage') or c['coverImage']]})
          def one(path):
             cmd=['curl','-fsSI','--max-time','20','https://madsaboutcake.sitesbystratlens.workers.dev/'+path]
             r=subprocess.run(cmd,text=True,capture_output=True)
             return (path,r.returncode==0 and 'content-type: image/webp' in r.stdout.lower())
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as pool: out=list(pool.map(one,paths))
          bad=[p for p,ok in out if not ok]
          print('Original media:',len(paths),'broken:',len(bad))
          if bad:print(bad[:15]);raise SystemExit(1)
          PY
