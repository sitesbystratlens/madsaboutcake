name: Import four selected gallery photos and face-safe session still (once)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mads-add-gallery-4-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Download exact original post photos and generate derivatives
        run: |
          python - <<'PY'
