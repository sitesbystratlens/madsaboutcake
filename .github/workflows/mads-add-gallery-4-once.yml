          P={'DQ0WjCPEgqr':'M508','DJQ6B-tBQyw':'M337','DINfV1OhprN':'M316','DQTMOqiD53h':'M-vanrap-10'}
          def get(k):
           for t in range(3):
            try:
             q=urllib.request.Request(U[k],headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.instagram.com/'})
             b=urllib.request.urlopen(q,timeout=35).read();print('RETRIEVED',k,len(b),flush=True);return b
            except Exception as e:
             print('retry',k,str(e)[:90]);time.sleep(1+t)
           raise RuntimeError('Source unavailable: '+k)
          def save(im,p,w,h,q):
           im=ImageOps.exif_transpose(im).convert('RGB');im.thumbnail((w,h),Image.Resampling.LANCZOS)
           Path(p).parent.mkdir(parents=True,exist_ok=True);im.save(p,'WEBP',quality=q,method=6)
          for k,m in P.items():
           im=Image.open(BytesIO(get(k))).convert('RGB')
           save(im,f'assets/gallery-30/{k}-{m}.webp',950,1450,72)
           bg=ImageOps.fit(im,(480,600),Image.Resampling.LANCZOS).filter(ImageFilter.GaussianBlur(18))
           bg=ImageEnhance.Brightness(bg).enhance(.88)
           fg=im.copy();fg.thumbnail((480,600),Image.Resampling.LANCZOS)
           bg.paste(fg,((480-fg.width)//2,(600-fg.height)//2))
           p=Path(f'assets/gallery-30/thumbs/{k}-{m}-card.webp');p.parent.mkdir(parents=True,exist_ok=True);bg.save(p,'WEBP',quality=69,method=6)
          Path('/tmp/original.mads.mp4').write_bytes(get('DSR06gjEgJK'))
          subprocess.run(['ffmpeg','-y','-loglevel','error','-ss','1.6','-i','/tmp/original.mads.mp4','-frames:v','1','/tmp/mads-still.png'],check=True)
          save(Image.open('/tmp/mads-still.png'),'assets/workshops/DSR06gjEgJK-no-visible-faces.webp',720,1280,76)
          print('ALL MEDIA VERIFIED',flush=True)
          PY
      - name: Commit media only if every original source succeeded
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/gallery-30/ assets/workshops/DSR06gjEgJK-no-visible-faces.webp
          git commit -m "Add four owner-selected gallery images and face-safe session still"
          git pull --rebase origin main
          git push origin HEAD:main
