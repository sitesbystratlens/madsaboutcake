name: Verify live Mads category and cake care pages
on:
  push:
    branches: [main]
    paths:
      - 'weddings/**'
      - 'celebrations/**'
      - 'tiramisu-cakes/**'
      - 'decorate-and-sip/**'
      - 'cake-care/**'
      - 'enquire/**'
      - 'cakes/**'
      - 'assets/brand-site.js'
      - 'assets/brand-site.css'
      - '.github/workflows/check-live-interior-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Confirm category, manual enquiry and care content live
        shell: bash
        run: |
          set -euo pipefail
          SITE=https://madsaboutcake.sitesbystratlens.workers.dev
          for n in $(seq 1 15); do
            bad=0
            for page in weddings celebrations tiramisu-cakes decorate-and-sip cake-care enquire cakes pricing; do
              curl -fsSL --max-time 25 "$SITE/$page/?r=$GITHUB_SHA-$n" > "/tmp/mads-$page.html" || bad=1
              grep -Fq 'brand-site.css?v=20261105-brand2' "/tmp/mads-$page.html" || bad=1
              grep -Fq 'https://ig.me/m/madsaboutcake' "/tmp/mads-$page.html" || bad=1
              grep -Fq 'data-cake-toggle' "/tmp/mads-$page.html" || bad=1
              grep -Fq 'data-mobile-nav-toggle' "/tmp/mads-$page.html" || bad=1
              grep -Fq 'data-mobile-cakes-toggle' "/tmp/mads-$page.html" || bad=1
              grep -Fq 'href="/enquire/" aria-label="Contact Mads About Cake"' "/tmp/mads-$page.html" || bad=1
              grep -Fq '>Explore all</a>' "/tmp/mads-$page.html" || bad=1
              grep -Fq 'href="sms:+61425819951"' "/tmp/mads-$page.html" || bad=1
              grep -Fq 'aria-label="DM on Instagram"' "/tmp/mads-$page.html" || bad=1
              grep -Fq 'href="/cake-care/">Pickup &amp; care</a>' "/tmp/mads-$page.html" || bad=1
            done
            if [[ "$bad" == 0 ]] &&
               grep -Fq 'data-gallery="weddings"' /tmp/mads-weddings.html &&
               grep -Fq 'data-gallery="celebrations"' /tmp/mads-celebrations.html &&
               grep -Fq 'data-gallery="tiramisu"' /tmp/mads-tiramisu-cakes.html &&
               grep -Fq 'passenger-side floor' /tmp/mads-cake-care.html &&
               grep -Fq 'Temperature matters' /tmp/mads-cake-care.html &&
               grep -Fq 'Once you’re home' /tmp/mads-cake-care.html &&
               grep -Fq 'A final little reminder' /tmp/mads-cake-care.html &&
               ! grep -Fq '<form' /tmp/mads-enquire.html; then
               echo 'PASS: all new categories and care page are served, manual enquiry only'
               exit 0
            fi
            sleep 10
          done
          exit 1
