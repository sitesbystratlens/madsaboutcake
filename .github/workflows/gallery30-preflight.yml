name: Gallery 30 installer preflight
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-gallery-30.py'
      - '.github/workflows/gallery30-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax check
        run: python -m py_compile scripts/apply-gallery-30.py
      - name: Generate synthetic photo fixture and test real installer logic
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib
          rows=[
           ('DLdzEx3Btmr','Other/unspecified','Cake'),
           ('DCv93Blhb1I','Other/unspecified','Cake'),
           ('DYJ42NMkqlU','Weddings & engagements','Cake'),
           ('DA-B4huhKQ4','Birthdays','Cake'),
           ('DQYyHi-kn6R','Baby celebrations','Cupcakes'),
           ('DP-QFm2EhMp','Other/unspecified','Cake'),
           ('DGM5hj1hcJf','Love & anniversaries','Cake'),
           ('DJQ5RLthPKp','Other/unspecified','Cake'),
           ('DMmuv2mBvWk','Baby celebrations','Cake'),
           ('DQjHWq9krsH','Other/unspecified','Cake'),
           ('DVnJAZwEs0P','Other/unspecified','Cupcakes'),
           ('DSg_oqpkjyK','Weddings & engagements','Cake'),
           ('DWvn4Nekv8Z','Love & anniversaries','Cake'),
           ('DP079RakorA','Birthdays','Cake'),
           ('DG-S_-6BYNA','Other/unspecified','Cake'),
           ('DR8_-HBkjFa','Other/unspecified','Cake'),
           ('C8iniSsyccX','Birthdays','Cake'),
           ('DI75TIVBBgx','Baby celebrations','Cake'),
           ('DMCwjRoBfjy','Other/unspecified','Cake'),
           ('DKDwrNzBA65','Birthdays','Cupcakes'),
           ('DTMTuSdkm4Y','Weddings & engagements','Cake'),
           ('DdneHOekoku','Other/unspecified','Cake'),
           ('DBF6bqKhZK1','Birthdays','Cake'),
           ('DCTltZxh4Bq','Love & anniversaries','Cupcakes'),
           ('DJjIJNxB1ap','Weddings & engagements','Cake'),
           ('Db2wuYpEoIe','Love & anniversaries','Cake'),
           ('DK8nnIGBfLx','Birthdays','Cake'),
           ('DRHM4kxEqlA','Other/unspecified','Cake'),
           ('C7tOmcThkTA','Baby celebrations','Cupcakes'),
           ('DINfRR_BzYm','Love & anniversaries','Cake')]
          records=[]
          for k,(code,cat,product) in enumerate(rows,1):
              mid='M259' if code=='DGM5hj1hcJf' else 'M'+str(k)
              path='assets/gallery-30/'+code+'-'+mid+'.webp'
              thumb='assets/gallery-30/thumbs/'+code+'-'+mid+'-card.webp'
              pathlib.Path(path).parent.mkdir(parents=True,exist_ok=True)
              pathlib.Path(thumb).parent.mkdir(parents=True,exist_ok=True)
              pathlib.Path(path).write_bytes(b'x'*6500)
              pathlib.Path(thumb).write_bytes(b'x'*6500)
              records.append(dict(displayOrder=k,sourceShortcode=code,sourceOriginalFilename=('igexport-DGM5hj1hcJf-3.jpg' if code=='DGM5hj1hcJf' else 'igexport-'+code+'.jpg'),sourceMediaId=mid,instagramUrl='https://www.instagram.com/p/'+code+'/',coverImage=path,thumbnailImage=thumb,title='Fixture '+code,shortDescription='A cake from the source caption.',alt='Cake',productType=product,primaryOccasion='' if cat=='Other/unspecified' else cat,featureCategory=cat,captionEvidence='The original owner caption describing a cake',occasionEvidence='caption',reviewHoldReasons=['Owner approval required'],postEngagement=dict(likes=30,comments=5,responseIndex=70,extractDate='2026-10-27')))
          pathlib.Path('gallery30-manifest.json').write_text(json.dumps(dict(records=records)))
          PY
          python3 scripts/apply-gallery-30.py
          node scripts/test-editorial-presentation.mjs
          echo "Dry-run passed. Synthetic image files are never committed or deployed."
