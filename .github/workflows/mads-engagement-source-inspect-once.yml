            data=urllib.request.urlopen(req,timeout=25).read()
            im=Image.open(BytesIO(data)).convert('RGB')
            im.save('ribbon-source-candidates/%02d.jpg'%i,quality=90)
            th=ImageOps.contain(im,(220,240));thumbs.append((i,th))
            print('OK',i,len(data),im.size,flush=True)
           except Exception as e:print('FAILED',i,str(e)[:200],flush=True)
          if thumbs:
           out=Image.new('RGB',(6*235,((len(thumbs)+5)//6)*285),'white');d=ImageDraw.Draw(out)
           for k,(i,th) in enumerate(thumbs):
